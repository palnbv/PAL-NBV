# Pose Performance Estimation Scenarios
#
# Robot spawns in a half-circle around the pallet at origin (0,0)
# Always facing the pallet, distance varies from 1.0 to 8.0 meters
# Collision checking enabled - positions overlapping obstacles are skipped
#
# Coordinate system:
#   - Pallet at origin (0, 0)
#   - Angle 0° = robot at (0, -distance), facing +Y toward pallet
#   - Angle 90° = robot at (+distance, 0), facing -X toward pallet
#   - Angle 180° = robot at (0, +distance), facing -Y toward pallet
#   - Robot positions: x = distance * sin(angle), y = -distance * cos(angle)
#   - Robot yaw: angle + 90° (in radians: angle_rad + π/2) to face pallet
#
# Distances: 1.0m to 8.0m (step: 0.25m)
# Angle step: 4°
# Max steps per episode: 120
# Total scenarios: 968

